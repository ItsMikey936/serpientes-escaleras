<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serpientes y Escaleras</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <h1 class="header__title">Serpientes y Escaleras</h1>
  </header>

  <main class="main">
    <section class="game" aria-labelledby="game-title">
      <h2 id="game-title" class="game__title">Tablero</h2>

      <div class="game__status-bar">
        <p id="status" class="game__status" aria-live="polite" aria-atomic="true">
          Turno del Jugador 1
        </p>
        <div class="game__dice">
          <output id="dice-value" class="game__dice-value" aria-live="polite">—</output>
          <button id="dice-button" class="game__dice-button" type="button">Tirar dado</button>
        </div>
      </div>

      <div id="scenario-selector" class="scenario-selector" aria-label="Selección de escenario"></div>

      <section id="board" class="board" aria-label="Tablero de 100 casillas"></section>

      <button id="restart-button" class="game__restart-button" type="button">
        Reiniciar partida
      </button>
    </section>
  </main>

  <footer class="footer">
    <p class="footer__text">Juego de Serpientes y Escaleras — Vanilla JS</p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
